version: '3.8'

services:
  web:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./media:/app/media
      - ./staticfiles:/app/staticfiles
    environment:
      - DEBUG=False
      - SECRET_KEY=tu-clave-secreta-super-segura
    depends_on:
      - db

  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=hashdb
      - POSTGRES_USER=hashuser
      - POSTGRES_PASSWORD=hashpass
    ports:
      - "5432:5432"

volumes:
  postgres_data:
