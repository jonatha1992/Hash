<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Hash Web - Sistema de Hash Forense{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaR6nH8QpL7s0gK0U6z7bNb6pR2N5Lx9e5e5z5e5z5e5z5e5z5e5z5e5z5e" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet" integrity="sha384-abc123abc123abc123abc123abc123abc123abc123abc123abc123abc123abc123" crossorigin="anonymous">
    <!-- Select2 for searchable dropdowns -->
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" integrity="sha384-def456def456def456def456def456def456def456def456def456def456def456" crossorigin="anonymous" />
    <link href="https://cdn.jsdelivr.net/npm/select2-bootstrap-5-theme@1.3.0/dist/select2-bootstrap-5-theme.min.css" rel="stylesheet" integrity="sha384-ghi789ghi789ghi789ghi789ghi789ghi789ghi789ghi789ghi789ghi789ghi789" crossorigin="anonymous" />
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="{% url 'core:dashboard' %}">
                <i class="bi bi-shield-check"></i> Hash Web
            </a>
            <div class="navbar-nav ms-auto">
                {% if user.is_authenticated %}
                <a class="nav-link" href="{% url 'core:dashboard' %}">Dashboard</a>
                <a class="nav-link" href="{% url 'core:lista_hashes' %}">Hashes</a>
                <a class="nav-link" href="{% url 'core:lista_custodias' %}">Custodias</a>
                <a class="nav-link" href="{% url 'admin:index' %}">Admin</a>
                <a class="nav-link" href="/admin/logout/">Cerrar Sesión</a>
                {% else %}
                <a class="nav-link" href="/admin/login/">Iniciar Sesión</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <main class="container-fluid py-4">
        {% if messages %}
        {% for message in messages %}
        <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        {% endfor %}
        {% endif %}

        {% block content %}
        {% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Select2 for searchable dropdowns -->
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>

</html>
